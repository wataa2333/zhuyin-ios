workflows:
  ios-simulator:
    name: Zhuyin iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Build the app and keyboard extension
        script: |
          set -euo pipefail
          mkdir -p build/artifacts
          xcodebuild build \
            -project Zhuyin.xcodeproj \
            -scheme Zhuyin \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build/artifacts/xcodebuild.log
      - name: Verify and package the simulator app
        script: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Debug-iphonesimulator/Zhuyin.app"
          keyboard="$app/PlugIns/ZhuyinKeyboard.appex"
          test -x "$app/Zhuyin"
          test -x "$keyboard/ZhuyinKeyboard"
          test -s "$keyboard/Lexicon.tsv"
          ditto -c -k --keepParent "$app" build/artifacts/Zhuyin-Simulator.zip
    artifacts:
      - build/artifacts/Zhuyin-Simulator.zip
      - build/artifacts/xcodebuild.log
